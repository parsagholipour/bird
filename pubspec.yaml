name: push_up_bird
description: "Beakbound: an offline bird courier adventure with movement and touch mini-games."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flame: ^1.38.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  drift: ^2.35.0
  path_provider: ^2.1.6
  path: ^1.9.1
  audioplayers: ^6.8.1
  video_player: ^2.14.0
  games_services: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  pigeon: ^28.1.0
  drift_dev: ^2.35.0
  build_runner: ^2.15.1
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
  # gen-l10n (l10n.yaml): lib/l10n/arb -> lib/l10n/generated.
  generate: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/audio/story/
    - assets/audio/flight/
    - assets/audio/sprint_voice_examples/sprint_03.mp3
    - assets/audio/sprint_voice_examples/sprint_01.mp3
    - assets/audio/sprint_voice_examples/sprint_08.mp3
    - assets/audio/sprint_voice_examples/whee_no_laugh/whee_04.mp3
    - assets/fonts/Fredoka-LICENSE.txt
    - assets/fonts/Nunito-LICENSE.txt
    # Localization: subset script fonts and their licenses (MASTER-PLAN.md,
    # "Fonts"; tool/l10n/subset_fonts.py), story captions per language.
    - assets/fonts/l10n/BalooBhaijaan2-LICENSE.txt
    - assets/fonts/l10n/MPLUSRounded1c-LICENSE.txt
    - assets/fonts/l10n/Jua-LICENSE.txt
    - assets/fonts/l10n/Huninn-LICENSE.txt
    - assets/l10n/story/
    # What each voice pack holds (the packs themselves are deferred, below).
    - assets/voice/index.json
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    # Script fonts for the glyphs Fredoka and Nunito lack, subset to the
    # translations (lib/l10n/language_fonts.dart, tool/l10n/fonts.json).
    - family: BalooBhaijaan2
      fonts:
        - asset: assets/fonts/l10n/BalooBhaijaan2.ttf
    - family: MPLUSRounded1c
      fonts:
        - asset: assets/fonts/l10n/MPLUSRounded1c-Bold.ttf
          weight: 700
    - family: Jua
      fonts:
        - asset: assets/fonts/l10n/Jua.ttf
    - family: Huninn
      fonts:
        - asset: assets/fonts/l10n/Huninn.ttf
  # Voice packs: one on-demand Play feature module per language
  # (docs/localization.md). Generated by
  # `python3 tool/l10n/prepare_localized_voices.py --wire`; do not edit.
  # Dev builds can list fewer: `python3 tool/l10n/dev_voice_packs.py`.
  # voice-packs:begin
  deferred-components:
    - name: voice_es_419
      assets:
        - assets/voice/es_419/
        - assets/voice/es_419/story/
        - assets/voice/es_419/flight/
    - name: voice_pt_br
      assets:
        - assets/voice/pt_br/
        - assets/voice/pt_br/story/
        - assets/voice/pt_br/flight/
    - name: voice_id
      assets:
        - assets/voice/id/
        - assets/voice/id/story/
        - assets/voice/id/flight/
    - name: voice_fr
      assets:
        - assets/voice/fr/
        - assets/voice/fr/story/
        - assets/voice/fr/flight/
    - name: voice_de
      assets:
        - assets/voice/de/
        - assets/voice/de/story/
        - assets/voice/de/flight/
    - name: voice_ja
      assets:
        - assets/voice/ja/
        - assets/voice/ja/story/
        - assets/voice/ja/flight/
    - name: voice_ko
      assets:
        - assets/voice/ko/
        - assets/voice/ko/story/
        - assets/voice/ko/flight/
    - name: voice_tr
      assets:
        - assets/voice/tr/
        - assets/voice/tr/story/
        - assets/voice/tr/flight/
    - name: voice_zh_hant
      assets:
        - assets/voice/zh_hant/
        - assets/voice/zh_hant/story/
        - assets/voice/zh_hant/flight/
    - name: voice_ru
      assets:
        - assets/voice/ru/
        - assets/voice/ru/story/
        - assets/voice/ru/flight/
    - name: voice_ar
      assets:
        - assets/voice/ar/
        - assets/voice/ar/story/
        - assets/voice/ar/flight/
  # voice-packs:end
